# configs/config.yaml

seed: 42 # null(Null, NULL, ~) or 0~

topology: 
  name: "ex_exp_b" # ex_exp_a, ex_exp_b, ex_exp_c, ex_eval_A, ex_eval_B, ex_eval_C, ex_eval_D, ex_eval_E
  nodes: [0, 1, 2, 3, 4, 5]
  links: 
    - {u: 0, v: 1, capacity: 10000}
    #- {u: 0, v: 2, capacity: 10000}
    #- {u: 0, v: 3, capacity: 10000}
    #- {u: 0, v: 4, capacity: 10000}
    - {u: 0, v: 5, capacity: 10000}
    - {u: 1, v: 2, capacity: 10000}
    #- {u: 1, v: 3, capacity: 10000}
    #- {u: 1, v: 4, capacity: 10000}
    - {u: 1, v: 5, capacity: 10000}
    - {u: 2, v: 3, capacity: 10000}
    - {u: 2, v: 4, capacity: 10000}
    - {u: 2, v: 5, capacity: 10000}
    - {u: 3, v: 4, capacity: 10000}
    #- {u: 3, v: 5, capacity: 10000}
    - {u: 4, v: 5, capacity: 10000}

bandwidth_options: [150, 300, 450, 600, 750, 900, 1000]

lrrt: 
  enabled: false
  lr_min: 1e-6
  lr_max: 1e-2

train: 
  # num_failure: 7
  num_train_data: 100000
  # train_ratio +val_ratio = 1
  train_ratio: 0.8
  val_ratio: 0.2
  max_epoch: 1000

test:
  num_test_data: 10000

paths: 
  configs: 
    dir: "configs/"
    filename: 
      config_yaml: "config.yaml"
      hparam_yaml: "hyperparameter.yaml"
      runtime_yaml: "runtime.yaml"

  data: 
    train_dir: "data/raw/train/"
    test_dir: "data/raw/test/"
    filename: 
      traffic_log_csv: "traffic_log_{num}.csv"
      data_csv: "data_{num}.csv"

  datasets: 
    train_dir: "data/datasets/train/"
    test_dir: "data/datasets/test/"
    filename: 
      data_pt: "data_{num}.pt"
      labels_pt: "labels_{num}.pt"

  results: 
    root_dir: "results/"
    filename: 
      lr_range_test_png: "lr_range_test.png"
      checkpoint_pth: "checkpoint_model.pth"
      lr_log_pt: "lr_log.pt"
      train_log_pt: "train_log.pt"
      val_log_pt: "val_log.pt"
      result_json: "result.json"
      output_csv: "output.csv"